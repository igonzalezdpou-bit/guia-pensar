<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pensar para aprender · Destrezas, rutinas e estruturas cooperativas</title>
<link rel="stylesheet" href="fontes/fontes.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B5AA0">
<meta name="description" content="Guía de consulta para o profesorado: destrezas e rutinas de pensamento coa súa ficha para o estudantado e estruturas cooperativas simples. Galego, castelán e catalán.">
<meta name="author" content="Isabel González Mosquera">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pensar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="iconas/apple-touch-icon.png">
<link rel="icon" type="image/png" href="iconas/favicon.png">
<style>
:root {
  /* Guía de consulta: cabeceira azul, lapelas grandes (azul destrezas / laranxa rutinas), lista e detalle; amarelo para a acción principal */
  /* Estilo do colexio: azul #0B5AA0 e laranxa #FF8700, con verde lima, amarelo e celeste */
  --brand-blue: #0B5AA0; --brand-orange: #FF8700; --brand-green: #94BF11; --brand-yellow: #F8E113; --brand-cyan: #0C9AC6;
  --blue: #0B5AA0; --blue-soft: #E6F0F8;
  --orange: #B35900; --orange-soft: #FFF0DF;
  --green: #5B7A0A; --green-soft: #F1F7DC;
  --yellow: #F8E113; --yellow-soft: #FEF9D2; --yellow-ink: #6B5A00;
  --bg: #F4F4F4; --surface: #FFFFFF; --ink: #2B3036; --muted: #54595F; --line: #DEE1E5;
  --font-display: "Viga", "Trebuchet MS", Arial, sans-serif;
  --font-body: "Didact Gothic", "Century Gothic", "Segoe UI", Arial, sans-serif;
  --font-ui: "Montserrat", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12161D; --surface: #1B212B; --ink: #E9EDF3; --muted: #AAB3C2; --line: #333B48; --blue-soft: #1E2C40; --orange-soft: #3A2419; --green-soft: #1C3022; --yellow-soft: #3A3115; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12161D; --surface: #1B212B; --ink: #E9EDF3; --muted: #AAB3C2; --line: #333B48; --blue-soft: #1E2C40; --orange-soft: #3A2419; --green-soft: #1C3022; --yellow-soft: #3A3115; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16.5px; line-height: 1.6; }
h1, h2, h3, .tab .tt b, ol.steps .q { font-weight: 400; }
button { font-family: var(--font-ui); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand-orange); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Cabeceira */
header.top { background: var(--brand-blue); color: #fff; border-bottom: 6px solid var(--brand-orange); }
.stripe { height: 6px; background: linear-gradient(90deg, var(--brand-blue) 0 25%, var(--brand-green) 25% 50%, var(--brand-yellow) 50% 75%, var(--brand-cyan) 75%); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 22px; padding-bottom: 20px; }
.brand { display: flex; flex-direction: column; gap: 4px; max-width: 780px; }
.eyebrow { font-family: var(--font-ui); font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brand-yellow); }
.brand h1 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.15; color: #fff; }
.brand p { margin: 0; color: #E2EDF8; font-size: 16.5px; }
.langs { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.langs .lbl { font-family: var(--font-ui); font-size: 12px; font-weight: 600; color: #E2EDF8; }
.langs .seg { display: flex; border: 2px solid #fff; border-radius: 999px; overflow: hidden; }
.langs button { border: 0; background: transparent; padding: 8px 16px; font-weight: 700; font-size: 15px; cursor: pointer; color: #fff; }
.langs button[aria-pressed="true"] { background: var(--brand-orange); color: #1B2333; }

/* Como usar */
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px auto 0; }
@media (max-width: 760px) { .how { grid-template-columns: 1fr; } }
.how .st { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 16px; color: var(--ink); }
.how .n { flex: none; width: 36px; height: 36px; border-radius: 50%; color: #fff; font-family: var(--font-display); display: flex; align-items: center; justify-content: center; font-size: 16px; }

/* Lapelas grandes */
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px auto 0; }
@media (max-width: 900px) { .tabs { grid-template-columns: 1fr; } }
.tab { display: flex; align-items: center; gap: 14px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 18px; cursor: pointer; font-family: var(--font-body); }
.tab .ic { flex: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.tab .tt { display: flex; flex-direction: column; gap: 0; }
.tab .tt b { font-family: var(--font-display); font-size: 24px; line-height: 1.2; }
.tab .tt span { font-size: 14.5px; color: var(--muted); }
.tab .cnt { margin-left: auto; font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.tab[data-type="des"] .ic { background: var(--blue-soft); color: var(--blue); }
.tab[data-type="rut"] .ic { background: var(--orange-soft); color: var(--orange); }
.tab[data-type="des"][aria-selected="true"] { background: var(--brand-blue); border-color: var(--brand-blue); color: #fff; }
.tab[data-type="rut"][aria-selected="true"] { background: var(--brand-orange); border-color: var(--brand-orange); color: #1B2333; }
.tab[data-type="rut"][aria-selected="true"] .tt span { color: #3A2A10; }
.tab[data-type="rut"][aria-selected="true"] .ic { background: rgba(255, 255, 255, .35); color: #1B2333; }
.tab[aria-selected="true"] .tt span { color: rgba(255, 255, 255, .88); }
.tab[aria-selected="true"] .ic { background: rgba(255, 255, 255, .18); color: #fff; }
.tab[data-type="coop"] .ic { background: var(--green-soft); color: var(--green); }
.tab[data-type="coop"][aria-selected="true"] { background: var(--brand-green); border-color: var(--brand-green); color: #1B2333; }
.tab[data-type="coop"][aria-selected="true"] .tt span { color: #2A3510; }
.tab[data-type="coop"][aria-selected="true"] .ic { background: rgba(255, 255, 255, .35); color: #1B2333; }
.intro { margin: 14px auto 0; }
.intro .box { background: var(--green-soft); border-left: 6px solid var(--brand-green); border-radius: 14px; padding: 12px 18px; }
.intro h2 { font-size: 20px; margin-bottom: 4px; }
.intro p { margin: 0; max-width: 95ch; }
.intro a { color: var(--blue); font-weight: 600; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .group-h { color: var(--ink) !important; } :root:not([data-theme="light"]) .intro a { color: #9CC6F0; } }
:root[data-theme="dark"] .group-h { color: var(--ink) !important; }
:root[data-theme="dark"] .intro a { color: #9CC6F0; }
.facts { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.facts .f b { display: block; font-family: var(--font-ui); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.facts .f span { font-size: 16px; }
.srclink { display: inline-flex; align-items: center; gap: 8px; color: var(--blue); font-weight: 700; font-family: var(--font-ui); font-size: 15px; }
.tab:hover:not([aria-selected="true"]) { border-color: var(--brand-orange); }

/* Filtros e busca */
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 14px auto 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: 14.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip .dot { width: 11px; height: 11px; border-radius: 50%; }
.chip[aria-pressed="true"] { border-color: var(--brand-orange); background: var(--orange-soft); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 0 12px; flex: 1; min-width: 240px; max-width: 380px; }
.search:focus-within { border-color: var(--brand-orange); }
.search input { border: 0; background: transparent; padding: 9px 0; width: 100%; outline: none; }
.search svg { flex: none; color: var(--muted); }

/* Lista + detalle */
main.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; padding-bottom: 36px; }
@media (max-width: 880px) { main.layout { grid-template-columns: 1fr; } }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 880px) { .list { position: static; max-height: none; } }
.list-h { font-size: 13px; color: var(--muted); padding: 6px 10px 2px; font-weight: 600; }
.group-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 12px 10px 4px; }
.group-h::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.item { display: grid; grid-template-columns: 32px minmax(0, 1fr) 16px; gap: 10px; align-items: center; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 9px 10px; cursor: pointer; }
.item:hover { background: var(--orange-soft); }
.item[aria-current="true"] { background: var(--orange-soft); box-shadow: inset 4px 0 0 var(--c); }
.item .num { width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.item .nm { font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.item .kd { display: block; font-size: 13.5px; color: var(--muted); font-weight: 400; }
.item .go { color: var(--muted); }
.empty { color: var(--muted); padding: 14px; font-size: 15px; }

.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; scroll-margin-top: 10px; }
.d-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.d-nav .pos { font-weight: 600; color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.d-nav .grp { display: flex; gap: 8px; }
.navbtn { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; }
.navbtn:hover:not([disabled]) { border-color: var(--brand-orange); background: var(--orange-soft); }
.navbtn[disabled] { opacity: .45; cursor: default; }
.backbtn { display: none; }
@media (max-width: 880px) { .backbtn { display: inline-flex; } }
.d-head { padding: 20px 26px 18px; border-left: 8px solid var(--c); background: var(--t); color: #1B2333; }
.d-kicker { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.d-head h2 { font-size: clamp(26px, 3vw, 36px); line-height: 1.15; margin-top: 6px; color: #1B2333; }
.d-head p { margin: 8px 0 0; font-size: 17px; max-width: 70ch; }
.d-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .d-body { grid-template-columns: 1fr; } }
.d-text { padding: 20px 26px 26px; display: flex; flex-direction: column; gap: 20px; }
.lab { display: flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.lab::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--k, var(--c)); }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ol.steps li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
ol.steps li:first-child { border-top: 0; }
ol.steps .b { width: 36px; height: 36px; border-radius: 50%; background: var(--c); color: #fff; font-family: var(--font-display); font-size: 17px; display: flex; align-items: center; justify-content: center; }
ol.steps .q { font-family: var(--font-display); font-size: 19px; line-height: 1.3; }
ol.steps .nt { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-top: 4px solid var(--k); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.card ul { margin: 0; padding-left: 18px; }
.card li + li { margin-top: 3px; }
.card.tip { background: var(--yellow-soft); border-color: transparent; border-top-color: var(--brand-yellow); }
.vant { display: flex; flex-wrap: wrap; gap: 8px; }
.vant span { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 600; font-size: 15px; background: var(--green-soft); }
.vant svg { color: var(--green); flex: none; }
.vant span, .lab, .d-kicker, .group-h, .list-h, .d-nav .pos, .chip, .cmp-grid .h { font-family: var(--font-ui); }

.d-ficha { border-left: 1px solid var(--line); padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
@media (max-width: 1100px) { .d-ficha { border-left: 0; border-top: 1px solid var(--line); } }
.d-ficha .kid { font-size: 15px; color: var(--muted); }
.d-ficha .kid b { color: var(--ink); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 2px solid transparent; border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 15.5px; }
.btn.main { background: var(--brand-orange); color: #1B2333; border-color: var(--brand-orange); }
.btn.main:hover { filter: brightness(1.05); box-shadow: 0 3px 10px rgba(255, 135, 0, .35); }
.btn.sec { background: var(--surface); color: var(--blue); border-color: var(--blue); }
:root[data-theme="dark"] .btn.sec { color: #9CC0EE; border-color: #9CC0EE; }
.btn[disabled] { opacity: .6; cursor: progress; }
.thumb { display: block; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 0; cursor: zoom-in; overflow: hidden; box-shadow: 0 6px 18px rgba(20, 30, 50, .10); }
.thumb img { display: block; width: 100%; height: auto; aspect-ratio: 794 / 1123; }
.status { font-size: 14.5px; color: var(--muted); min-height: 1.4em; }
.note { font-size: 13.5px; color: var(--muted); }

/* Comparación */
.compare { margin: 0 auto 26px; }
.compare details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.compare summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-family: var(--font-display); font-size: 18px; }
.cmp-grid { display: grid; grid-template-columns: 140px minmax(0, 1fr) minmax(0, 1fr); padding: 0 16px 14px; font-size: 15px; }
.cmp-grid > div { padding: 7px 10px; border-top: 1px solid var(--line); }
.cmp-grid .h { font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; border-top: 0; }
.cmp-grid .hd { color: var(--blue); } .cmp-grid .hr { color: var(--orange); }
.cmp-grid .k { font-weight: 600; }

dialog.lb { border: 0; padding: 0; background: transparent; max-width: min(96vw, 900px); width: 100%; }
dialog.lb::backdrop { background: rgba(10, 14, 22, .72); }
dialog.lb .inner { background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
dialog.lb .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
dialog.lb .bar strong { font-family: var(--font-display); font-size: 18px; }
dialog.lb img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 6px; background: #fff; }

footer { border-top: 6px solid var(--brand-orange); background: var(--brand-blue); color: #E2EDF8; }
footer .wrap { padding-top: 16px; padding-bottom: 20px; font-size: 13.5px; }
.foot { display: flex; flex-direction: column; gap: 6px; }
.foot p { margin: 0; }
.credit { font-size: 15px; color: #fff; }
.credit b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.credit span { color: #E2EDF8; }
.refs { opacity: .9; }
@media (prefers-reduced-motion: no-preference) { .item, .chip, .btn, .tab, .navbtn { transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease; } }

.intro summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
.intro summary::-webkit-details-marker { display: none; }
.intro summary::after { content: ""; flex: none; width: 9px; height: 9px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(45deg); margin: -4px 4px 0 auto; transition: transform .15s; }
.intro details[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.intro h2 { margin-bottom: 0 !important; }
.intro details[open] p { margin-top: 6px; }
/* ===== Versión móbil tipo app ===== */
.m-lab, .m-act { display: none; }
@media (max-width: 880px) {
  body { padding-bottom: calc(74px + env(safe-area-inset-bottom)); }
  header.top .wrap { padding-top: 14px; padding-bottom: 14px; gap: 10px; }
  .eyebrow, .brand p, .langs .lbl, #how { display: none !important; }
  .brand h1 { font-size: 22px; }
  .langs { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; width: 100%; }
  .langs button { padding: 6px 12px; font-size: 14px; }
  .langs .inst { margin-top: 0; padding: 6px 12px; font-size: 13.5px; }

  /* barra inferior de lapelas */
  .tabs { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; margin: 0; max-width: none; gap: 0; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(20, 30, 50, .08); }
  .tab { flex-direction: column; gap: 3px; padding: 6px 4px; border: 0; border-radius: 12px; background: transparent !important; color: var(--muted) !important; text-align: center; }
  .tab .tt, .tab .cnt { display: none; }
  .tab .m-lab { display: block; font-family: var(--font-ui); font-size: 12.5px; font-weight: 700; line-height: 1.15; }
  .tab .ic { width: 44px; height: 32px; border-radius: 999px; background: transparent !important; color: var(--muted) !important; }
  .tab[aria-selected="true"] { color: var(--ink) !important; }
  .tab[data-type="des"][aria-selected="true"] .ic { background: var(--brand-blue) !important; color: #fff !important; }
  .tab[data-type="rut"][aria-selected="true"] .ic { background: var(--brand-orange) !important; color: #1B2333 !important; }
  .tab[data-type="coop"][aria-selected="true"] .ic { background: var(--brand-green) !important; color: #1B2333 !important; }

  /* busca e filtros */
  .intro .box { padding: 10px 14px; font-size: 15px; }
  .intro h2 { font-size: 17px; }
  .controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 12px; }
  .controls .search { order: -1; }
  .search { max-width: none; min-width: 0; }
  .search input { padding: 11px 0; font-size: 16px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 14px; }

  /* lista a pantalla completa; o detalle só cando se abre */
  .list { border-radius: 16px; padding: 6px; }
  .item { padding: 12px 10px; }
  .detail { display: none; }
  body.m-detail header.top, body.m-detail .intro, body.m-detail .controls, body.m-detail .list, body.m-detail .compare, body.m-detail .stripe { display: none !important; }
  body.m-detail main.layout { padding-top: 0; padding-left: 0; padding-right: 0; }
  body.m-detail .detail { display: block; border-radius: 0; border: 0; }

  /* barra superior do detalle, fixa */
  .d-nav { position: sticky; top: 0; z-index: 30; flex-wrap: nowrap; padding: 8px 10px; box-shadow: 0 2px 10px rgba(20, 30, 50, .06); }
  .d-nav .pos { font-size: 14px; white-space: nowrap; }
  .d-nav .pos-t { display: none; }
  .navbtn { padding: 8px 10px; }
  .navbtn .nt-l { display: none; }

  const ZOOM = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"></path></svg>';
  const HOWC = ['var(--blue)', 'var(--orange)', 'var(--green)'];

  let lang = 'gl', type = 'des', cat = 'all', q = '', current = { type: 'des', n: 1 };
  try { const s = localStorage.getItem('pensar-lang'); if (['gl', 'es', 'ca'].includes(s)) lang = s; } catch (e) {}

  const find = (t, n) => DATA[t].find((x) => x.n === n);
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function parseHash() {
    const m = (location.hash || '').match(/^#(destreza|rutina|estrutura)-(\d{1,2})$/);
    if (!m) return null;
    const t = { destreza: 'des', rutina: 'rut', estrutura: 'coop' }[m[1]], n = parseInt(m[2], 10);
    return find(t, n) ? { type: t, n } : null;
  }
  const hashOf = () => ({ des: 'destreza-', rut: 'rutina-', coop: 'estrutura-' }[current.type] + pad(current.n));
  function setHash() {
    const h = '#' + hashOf();
    if (location.hash !== h) { try { history.replaceState(history.state, '', h); } catch (e) { location.hash = h; } }
  }

  function renderStatic() {
    const U = DATA.ui[lang];
    document.documentElement.lang = lang;
    $('h-title').textContent = U.title; $('h-sub').textContent = U.sub; $('eyebrow').textContent = U.eyebrow;
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    $('how').setAttribute('aria-label', U.how_t);
    $('how').innerHTML = U.how.map((s, i) => '<div class="st"><span class="n" style="background:' + HOWC[i] + '">' + (i + 1) + '</span><span>' + esc(s) + '</span></div>').join('');
    $('t-des-b').textContent = U.tab_des; $('t-des-s').textContent = U.sub_des;
    $('t-rut-b').textContent = U.tab_rut; $('t-rut-s').textContent = U.sub_rut;
    $('t-coop-b').textContent = U.tab_coop; $('t-coop-s').textContent = U.sub_coop;
    $('t-des-m').textContent = U.tab_des; $('t-rut-m').textContent = U.tab_rut; $('t-coop-m').textContent = U.tab_coop_m;
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.type === type));
    const I = $('intro');
    if (type === 'coop') { I.hidden = false; const wasOpen = I.querySelector('details') ? I.querySelector('details').open : !window.matchMedia('(max-width: 880px)').matches;
      I.innerHTML = '<details class="box"' + (wasOpen ? ' open' : '') + '><summary><h2>' + esc(U.coop_t) + '</h2></summary><p>' + esc(U.coop_p) + ' <a href="' + U.src_index + '" target="_blank" rel="noopener">' + esc(U.src_note) + '</a></p></details>'; } else { I.hidden = true; I.innerHTML = ''; }
    $('q').placeholder = U.search_ph; $('q-label').textContent = U.search;
    $('cmp-t').textContent = U.cmp_t;
    $('cmp-grid').innerHTML = '<div class="h"></div><div class="h hd">' + esc(U.cmp_d) + '</div><div class="h hr">' + esc(U.cmp_r) + '</div>' +
      U.cmp.map((r) => '<div class="k">' + esc(r[0]) + '</div><div>' + esc(r[1]) + '</div><div>' + esc(r[2]) + '</div>').join('');
    $('refs').textContent = U.refs;
    $('credit').innerHTML = esc(U.by) + ' <b>' + esc(U.author) + '</b> <span>· ' + esc(U.centro) + '</span>';
    $('lb-close').textContent = U.close;
    renderChips();
  }

  function renderChips() {
    const U = DATA.ui[lang];
    const keys = Object.keys(DATA.cats).filter((k) => DATA.cats[k].type === type);
    let h = '<button type="button" class="chip" data-cat="all" aria-pressed="' + (cat === 'all') + '">' + esc(U.all) + '</button>';
    keys.forEach((k) => {
      const C = DATA.cats[k];
      h += '<button type="button" class="chip" data-cat="' + k + '" aria-pressed="' + (cat === k) + '"><span class="dot" style="background:' + C.c + '"></span>' + esc(C[lang]) + '</button>';
    });
    $('chips').innerHTML = h;
  }

  function visible() {
    const nq = norm(q.trim());
    return DATA[type].filter((x) => (cat === 'all' || x.cat === cat) &&
      (!nq || norm(x.name[lang] + ' ' + x.kid[lang] + ' ' + x.para[lang]).includes(nq)));
  }

  function renderList() {
    const U = DATA.ui[lang];
    let h = '<div class="list-h">' + esc(U.list) + ':</div>', last = null;
    const list = visible();
    list.forEach((x) => {
      const C = DATA.cats[x.cat];
      if (x.cat !== last) { h += '<div class="group-h" style="--c:' + C.c + ';color:' + C.c + '">' + esc(C[lang]) + '</div>'; last = x.cat; }
      const cur = current.type === type && current.n === x.n;
      const kid = x.kid[lang] !== x.name[lang] ? '<span class="kd">' + esc(x.kid[lang]) + '</span>' : '';
      h += '<button type="button" class="item" style="--c:' + C.c + '" data-n="' + x.n + '" aria-current="' + cur + '"><span class="num">' + pad(x.n) +
        '</span><span class="nm">' + esc(x.name[lang]) + kid + '</span><span class="go">' + ARROW('r') + '</span></button>';
    });
    $('list').innerHTML = list.length ? h : '<p class="empty">' + esc(U.none) + '</p>';
  }

  const img = (t, n, l) => 'fichas/' + l + '/' + t + '-' + pad(n) + '.jpg';

  const TABN = (U, t) => ({ des: U.tab_des, rut: U.tab_rut, coop: U.tab_coop }[t]);
  const KICK = (U, t) => ({ des: U.k_des, rut: U.k_rut, coop: U.k_coop }[t]);
  function renderDetail() {
    const U = DATA.ui[lang];
    const t = current.type, x = find(t, current.n), C = DATA.cats[x.cat], all = DATA[t];
    if (t === 'coop') return renderCoop(U, x, C, all);
    const idx = all.findIndex((y) => y.n === x.n);
    const steps = x.steps[lang].map((s, i) => '<li><span class="b">' + (i + 1) + '</span><span><span class="q">' + esc(s.q) + '</span>' +
      (s.note ? '<span class="nt">' + esc(s.note) + '</span>' : '') + '</span></li>').join('');
    const ul = (arr) => '<ul>' + arr.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul>';
    let cards = '';
    if (t === 'des') cards += '<div class="card" style="--k:var(--blue)"><h3 class="lab" style="--k:var(--blue)">' + esc(U.org) + '</h3><div>' + esc(x.org[lang]) + '</div></div>';
    cards += '<div class="card" style="--k:var(--orange)"><h3 class="lab" style="--k:var(--orange)">' + esc(U.cando) + '</h3>' + ul(x.cando[lang]) + '</div>';
    if (t === 'des') cards += '<div class="card" style="--k:var(--green)"><h3 class="lab" style="--k:var(--green)">' + esc(U.meta) + '</h3>' + ul(x.meta[lang]) + '</div>';
    cards += '<div class="card tip"><h3 class="lab" style="--k:var(--yellow)">' + esc(U.consello) + '</h3><div>' + esc(x.consello[lang]) + '</div></div>';
    const src = img(t, x.n, lang);
    const D = $('detail');
    D.style.setProperty('--c', C.c); D.style.setProperty('--t', C.t);
    D.innerHTML =
      '<div class="d-nav"><button type="button" class="navbtn backbtn" id="back">' + ARROW('u') + esc(U.back) + '</button>' +
        '<span class="pos">' + (idx + 1) + ' ' + esc(U.of) + ' ' + all.length + '<span class="pos-t"> · ' + esc(TABN(U, t)) + '</span></span>' +
        '<span class="grp"><button type="button" class="navbtn" id="prev"' + (idx === 0 ? ' disabled' : '') + '>' + ARROW('l') + esc(U.prev) + '</button>' +
        '<button type="button" class="navbtn" id="next"' + (idx === all.length - 1 ? ' disabled' : '') + '>' + esc(U.next) + ARROW('r') + '</button></span></div>' +
      '<div class="d-head"><div class="d-kicker"><span>' + esc(KICK(U, t)) + ' · ' + esc(C[lang]) + '</span><span>' + pad(x.n) + '</span></div>' +
        '<h2>' + esc(x.name[lang]) + '</h2><p>' + esc(x.para[lang]) + '</p>' +
        '<div class="m-act"><button type="button" class="btn sec" id="big2">' + ZOOM + esc(U.see) + '</button>' +
        '<button type="button" class="btn main" id="pdf2"' + (downloads ? '' : ' hidden') + '>' + DL + esc(U.pdf) + '</button>' +
        '<div class="status" id="status2" role="status"></div></div></div>' +
      '<div class="d-body"><div class="d-text">' +
        '<section><h3 class="lab">' + esc(t === 'des' ? U.mapa : U.pasos) + '</h3><ol class="steps">' + steps + '</ol></section>' +
        '<div class="cards2">' + cards + '</div>' +
        '<section><h3 class="lab" style="--k:var(--green)">' + esc(U.vant) + '</h3><div class="vant">' + x.vant[lang].map((v) => '<span>' + CHECK + esc(v) + '</span>').join('') + '</div></section>' +
      '</div>' +
      '<aside class="d-ficha"><div><h3 class="lab" style="--k:var(--yellow)">' + esc(U.ficha) + '</h3><div class="kid">' + esc(U.ficha_t) + ': <b>' + esc(x.kid[lang]) + '</b></div></div>' +
        '<div class="actions"><button type="button" class="btn main" id="pdf"' + (downloads ? '' : ' hidden') + '>' + DL + esc(U.pdf) + '</button>' +
        '<button type="button" class="btn sec" id="big">' + ZOOM + esc(U.big) + '</button></div>' +
        '<div class="status" id="status" role="status"></div>' +
        '<button type="button" class="thumb" id="thumb" aria-label="' + esc(U.big) + ': ' + esc(x.kid[lang]) + '"><img src="' + src + '" alt="' + esc(U.ficha + ': ' + x.kid[lang]) + '" width="794" height="1123"></button>' +
        '<div class="note">' + esc(U.ficha_lang) + '</div></aside></div>';
    $('thumb').onclick = openLb; $('big').onclick = openLb; $('pdf').onclick = makePdf;
    $('big2').onclick = openLb; $('pdf2').onclick = makePdf;
    $('prev').onclick = () => { if (idx > 0) select(t, all[idx - 1].n, true); };
    $('next').onclick = () => { if (idx < all.length - 1) select(t, all[idx + 1].n, true); };
    $('back').onclick = closeDetail;
  }

  function navHtml(U, t, idx, all) {
    return '<div class="d-nav"><button type="button" class="navbtn backbtn" id="back">' + ARROW('u') + esc(U.back) + '</button>' +
      '<span class="pos">' + (idx + 1) + ' ' + esc(U.of) + ' ' + all.length + '<span class="pos-t"> · ' + esc(TABN(U, t)) + '</span></span>' +
      '<span class="grp"><button type="button" class="navbtn" id="prev"' + (idx === 0 ? ' disabled' : '') + '>' + ARROW('l') + esc(U.prev) + '</button>' +
      '<button type="button" class="navbtn" id="next"' + (idx === all.length - 1 ? ' disabled' : '') + '>' + esc(U.next) + ARROW('r') + '</button></span></div>';
  }
  function bindNav(t, idx, all) {
    $('prev').onclick = () => { if (idx > 0) select(t, all[idx - 1].n, true); };
    $('next').onclick = () => { if (idx < all.length - 1) select(t, all[idx + 1].n, true); };
    $('back').onclick = closeDetail;
  }
  function renderCoop(U, x, C, all) {
    const idx = all.findIndex((y) => y.n === x.n);
    const steps = x.steps[lang].map((s, i) => '<li><span class="b">' + (i + 1) + '</span><span><span class="q">' + esc(s.q) + '</span></span></li>').join('');
    const D = $('detail');
    D.style.setProperty('--c', C.c); D.style.setProperty('--t', C.t);
    const fact = (k, v) => v ? '<div class="f"><b>' + esc(k) + '</b><span>' + esc(v) + '</span></div>' : '';
    D.innerHTML = navHtml(U, 'coop', idx, all) +
      '<div class="d-head"><div class="d-kicker"><span>' + esc(U.k_coop) + ' · ' + esc(C[lang]) + '</span><span>' + pad(x.n) + '</span></div>' +
        '<h2>' + esc(x.name[lang]) + '</h2><p>' + esc(x.para[lang]) + '</p></div>' +
      '<div class="d-body"><div class="d-text">' +
        '<section><h3 class="lab">' + esc(U.pasos) + '</h3><ol class="steps">' + steps + '</ol></section>' +
        '<div class="cards2"><div class="card" style="--k:var(--orange)"><h3 class="lab" style="--k:var(--orange)">' + esc(U.roles) + '</h3><div>' + esc(x.roles[lang]) + '</div></div>' +
        '<div class="card tip"><h3 class="lab" style="--k:var(--yellow)">' + esc(U.tip) + '</h3><div>' + esc(x.tip[lang]) + '</div></div></div>' +
      '</div>' +
      '<aside class="d-ficha"><h3 class="lab" style="--k:var(--brand-green)">' + esc(U.card) + '</h3><div class="facts">' +
        fact(U.group, x.group[lang]) + fact(U.pattern, x.pattern[lang]) + fact(U.when, x.para[lang]) + fact(U.origin, x.origin) + '</div>' +
        '<a class="srclink" href="' + x.src + '" target="_blank" rel="noopener">' + esc(U.src) + ARROW('r') + '</a>' +
        '<div class="note">' + esc(U.src_note) + '</div></aside></div>';
    bindNav('coop', idx, all);
  }

  function openLb() {
    const U = DATA.ui[lang], x = find(current.type, current.n);
    $('lb-t').textContent = x.kid[lang];
    $('lb-img').src = img(current.type, x.n, lang); $('lb-img').alt = U.ficha + ': ' + x.kid[lang];
    try { $('lb').showModal(); } catch (e) { $('lb').setAttribute('open', ''); }
  }
  $('lb-close').onclick = () => { try { $('lb').close(); } catch (e) { $('lb').removeAttribute('open'); } };
  $('lb').addEventListener('click', (e) => { if (e.target === $('lb')) $('lb-close').onclick(); });

  let downloads = { save: async ({ filename, data }) => {
    const url = URL.createObjectURL(data); const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return { status: 'saved' };
  } };
  (async () => {

    ['pdf', 'pdf2'].forEach((id) => { const b = $(id); if (b && downloads) b.hidden = false; });
  })();

  async function makePdf() {
    const U = DATA.ui[lang], x = find(current.type, current.n), b = $('pdf');
    const st = { set textContent(v) { ['status', 'status2'].forEach((id) => { const e = $(id); if (e) e.textContent = v; }); } };
    if (!downloads) { st.textContent = U.pdf_un; return; }
    if (!window.jspdf) { st.textContent = U.pdf_err; return; }
    b.disabled = true; st.textContent = U.pdf_wait;
    try {
      const res = await fetch(img(current.type, x.n, lang));
      const blob = await res.blob();
      const dataUrl = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(blob); });
      const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      doc.setProperties({ title: x.kid[lang] });
      doc.addImage(dataUrl, 'JPEG', 0, 0, 210, 297);
      const base = (current.type === 'des' ? 'destreza' : 'rutina') + '-' + pad(x.n) + '-' + lang;
      await downloads.save({ filename: 'ficha-' + base + '.pdf', data: doc.output('blob') });
      st.textContent = U.pdf_ok;
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') st.textContent = U.pdf_no;
      else if (['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) { st.textContent = U.pdf_un; b.hidden = true; }
      else st.textContent = U.pdf_err;
    } finally { b.disabled = false; }
  }

  const MOB = window.matchMedia('(max-width: 880px)');
  const isMob = () => MOB.matches;
  let listY = 0, pushed = false;
  function openDetail(push) {
    if (!isMob()) return;
    if (!document.body.classList.contains('m-detail')) {
      listY = window.scrollY;
      document.body.classList.add('m-detail');
      if (push) { try { history.pushState({ d: 1 }, ''); pushed = true; } catch (e) {} }
    }
    window.scrollTo(0, 0);
  }
  function closeDetail(fromPop) {
    if (!document.body.classList.contains('m-detail')) return;
    if (fromPop !== true && pushed) { pushed = false; history.back(); return; }
    document.body.classList.remove('m-detail');
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    window.scrollTo(0, listY);
  }
  window.addEventListener('popstate', () => { if (document.body.classList.contains('m-detail') && !(history.state && history.state.d)) { pushed = false; closeDetail(true); } });

  function select(t, n, scroll) {
    current = { type: t, n };
    if (type !== t) { type = t; cat = 'all'; renderStatic(); }
    renderList(); renderDetail();
    if (scroll && isMob()) openDetail(!document.body.classList.contains('m-detail'));
    setHash();
  }

  $('list').addEventListener('click', (e) => { const b = e.target.closest('.item'); if (b) select(type, parseInt(b.dataset.n, 10), true); });
  $('chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; cat = b.dataset.cat; renderChips(); renderList(); });
  $('q').addEventListener('input', (e) => { q = e.target.value; renderList(); });
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
    const t = b.dataset.type;
    if (isMob() && document.body.classList.contains('m-detail')) closeDetail();
    if (t === type) { if (isMob()) window.scrollTo(0, 0); return; }
    type = t; cat = 'all'; q = ''; $('q').value = '';
    renderStatic(); select(t, 1, false);
    if (isMob()) { listY = 0; window.scrollTo(0, 0); }
  }));
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => {
    lang = b.dataset.lang; try { localStorage.setItem('pensar-lang', lang); } catch (e) {}
    renderStatic(); renderList(); renderDetail();
  }));
  window.addEventListener('hashchange', () => { const h = parseHash(); if (h) select(h.type, h.n, false); });

  const h = parseHash();
  if (h) { current = h; type = h.type; }
  renderStatic(); renderList(); renderDetail();
  if (h && isMob()) document.body.classList.add('m-detail');
  MOB.addEventListener && MOB.addEventListener('change', () => { if (!isMob()) document.body.classList.remove('m-detail'); });
})();
</script>

<script>
(function () {
  var T = {
    gl: { b: 'Instalar a app', ios: 'Para instalala no iPhone ou iPad: toca <b>Compartir</b> e despois <b>Engadir á pantalla de inicio</b>.', other: 'Para instalala, abre o menú do navegador e escolle <b>Instalar aplicación</b> ou <b>Engadir á pantalla de inicio</b>.', ok: 'Aplicación instalada.', close: 'Pechar' },
    es: { b: 'Instalar la app', ios: 'Para instalarla en el iPhone o iPad: toca <b>Compartir</b> y después <b>Añadir a pantalla de inicio</b>.', other: 'Para instalarla, abre el menú del navegador y elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.', ok: 'Aplicación instalada.', close: 'Cerrar' },
    ca: { b: 'Instal·lar l’app', ios: 'Per instal·lar-la a l’iPhone o l’iPad: toca <b>Comparteix</b> i després <b>Afegeix a la pantalla d’inici</b>.', other: 'Per instal·lar-la, obre el menú del navegador i tria <b>Instal·la l’aplicació</b> o <b>Afegeix a la pantalla d’inici</b>.', ok: 'Aplicació instal·lada.', close: 'Tanca' }
  };
  var L = function () { var l = document.documentElement.lang; return T[l] ? l : 'gl'; };
  var btn = document.getElementById('inst'), lbl = document.getElementById('inst-t'), deferred = null;
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function label() { lbl.textContent = T[L()].b; }
  new MutationObserver(label).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  label();
  function toast(html) {
    var old = document.querySelector('.itoast'); if (old) old.remove();
    var d = document.createElement('div'); d.className = 'itoast'; d.setAttribute('role', 'status');
    d.innerHTML = '<span>' + html + '</span><button type="button" aria-label="' + T[L()].close + '">×</button>';
    d.querySelector('button').onclick = function () { d.remove(); };
    document.body.appendChild(d); setTimeout(function () { if (d.isConnected) d.remove(); }, 12000);
  }
  if (!standalone) {
    if (ios) btn.hidden = false;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; btn.hidden = false; });
  }
  window.addEventListener('appinstalled', function () { btn.hidden = true; deferred = null; toast(T[L()].ok); });
  btn.addEventListener('click', function () {
    if (deferred) { deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; }); }
    else toast(ios ? T[L()].ios : T[L()].other);
  });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
